name: release

# 打 tag（v*）→ 跑单测 → 出 APK → 自动发布到 GitHub Releases（用户远程可下载安装）
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 确保 Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null

      - name: 单元测试
        run: ./gradlew test --no-daemon

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 改名带版本号，方便用户分辨；debug 签名可直接安装
      - name: 重命名 APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "GuitarCoach-${GITHUB_REF_NAME}-debug.apk"

      # 用 runner 自带 gh 建 Release（避免第三方 action 解析失败的坑）
      - name: 发布到 GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=""
          case "$GITHUB_REF_NAME" in
            *-*) ARGS="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "GuitarCoach-${GITHUB_REF_NAME}-debug.apk#安装包（debug 签名，直接安装）" \
            --title "GuitarCoach ${GITHUB_REF_NAME}" \
            --generate-notes $ARGS
