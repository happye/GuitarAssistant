name: release

# 打 tag（v*）→ 跑单测 → 出 APK → 自动发布到 GitHub Releases（用户远程可下载安装）
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 全量历史：versionCode=提交数在浅克隆下恒为 1（监督员 P1）

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 确保 Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null

      - name: 单元测试
        run: ./gradlew test --no-daemon

      # versionCode=提交数（单调递增），versionName=tag 号（去掉 v 前缀）
      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon "-PpkgVersionCode=$(git rev-list --count HEAD)" "-PpkgVersionName=${GITHUB_REF_NAME#v}"

      # 改名带版本号，方便用户分辨；debug 签名可直接安装
      - name: 重命名 APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "GuitarCoach-${GITHUB_REF_NAME}-debug.apk"

      # 用 runner 自带 gh 建 Release；大文件（120MB）上传分步+重试（一次直传易超时，v0.2.29 实测教训）
      - name: 发布到 GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=""
          case "$GITHUB_REF_NAME" in
            *-*) ARGS="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "GuitarCoach ${GITHUB_REF_NAME}" \
            --generate-notes $ARGS || true
          for i in 1 2 3 4 5; do
            gh release upload "$GITHUB_REF_NAME" "GuitarCoach-${GITHUB_REF_NAME}-debug.apk" --clobber && echo "upload ok" && exit 0
            echo "upload retry $i..."; sleep 30
          done
          echo "asset upload failed after retries"; exit 1
